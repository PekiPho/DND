<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome to Orion</h2>
        <h3>Your Table-Top Adventure Awaits</h3>
        <div class="subtitle">Sign into your campaign hub</div>

        <div class="error-banner" *ngIf ="error$ | async as error">
            {{error}}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" formControlName="username"
                placeholder="Enter your username" autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                id="password" 
                type="password" 
                formControlName="password" 
                placeholder="Enter your password"
                autocomplete="current-password"/>
            </div>

            <button type="sumbit" class="submit" [disabled]="loginForm.invalid || (isLoading$ |async)">
                <span *ngIf="isLoading$ | async; else loginText">Signing in...</span>
                <ng-template #loginText>Sign In</ng-template>
            </button>

        </form>
        <div class="auth-footer">
            <p>Don't have an account? <a routerLink="/register">Register here</a></p>
        </div>
    </div>
</div>
