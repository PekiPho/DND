<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <h3>Your Table-Top Adventure Awaits</h3>
        <p class="subtitle">Join the campaign hub</p>
        <div class="error-banner" *ngIf="error$ | async as error">
            {{error}}
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" formControlName="username"
                placeholder="Choose a username" autocomplete="username"/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                id="password" 
                type="password" 
                formControlName="password" 
                placeholder="Choose a password"
                autocomplete="new-password"
                />
            </div>

            <button type="submit" [disabled]="registerForm.invalid || (isLoading$ | async)">
                <span *ngIf="isLoading$ | async; else registerText">Creating Account...</span>
                <ng-template #registerText>Register</ng-template>
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a routerLink="/login">Login here</a></p>
        </div>

    </div>
</div>
